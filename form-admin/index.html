<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Form recipients - WheelsPlay admin</title>
<style>
body{font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px;color:#222}
h1{font-size:22px} label{display:block;margin:16px 0 4px;font-weight:600}
input[type=text],input[type=email],input[type=password]{width:100%;padding:8px;box-sizing:border-box;border:1px solid #999;border-radius:4px}
.row{display:flex;gap:8px;margin-bottom:8px} .row input{flex:1} button{padding:8px 14px;cursor:pointer}
#msg{margin-top:16px;padding:10px;border:1px solid #888;display:none} small{color:#666}
</style></head><body>
<h1>Quote form recipients</h1>
<p>Every quote request from the website is emailed to the first address and copied to the others.</p>
<div id="list"></div>
<button type="button" id="add">+ Add email</button>
<label for="token">GitHub token</label>
<input type="password" id="token" autocomplete="off" placeholder="Fine-grained token with Contents: read &amp; write on this repo">
<small>Used only in this browser to save the change to the repository. It is never stored.</small>
<p><button type="button" id="save"><b>Save recipients</b></button></p>
<div id="msg"></div>
<script>
var REPO='kanchan164432/wheelsplay-live', PATH='form-config.json', BRANCH='main';
var api='https://api.github.com/repos/'+REPO+'/contents/'+PATH;
var list=document.getElementById('list'), msg=document.getElementById('msg');
function say(t){msg.style.display='block';msg.textContent=t}
function addRow(v){var d=document.createElement('div');d.className='row';
 d.innerHTML='<input type="email" placeholder="name@example.com"><button type="button">Remove</button>';
 d.firstChild.value=v||'';d.lastChild.onclick=function(){d.remove()};list.appendChild(d)}
document.getElementById('add').onclick=function(){addRow('')};
fetch('../form-config.json',{cache:'no-store'}).then(function(r){return r.json()})
 .then(function(c){(c.emails||[]).forEach(addRow);if(!list.children.length)addRow('')}).catch(function(){addRow('')});
document.getElementById('save').onclick=function(){
 var emails=[].map.call(list.querySelectorAll('input'),function(i){return i.value.trim()}).filter(Boolean);
 var bad=emails.filter(function(e){return !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)});
 var token=document.getElementById('token').value.trim();
 if(!emails.length)return say('Add at least one email address.');
 if(bad.length)return say('Invalid email: '+bad.join(', '));
 if(!token)return say('Paste your GitHub token to save.');
 var h={Authorization:'Bearer '+token,Accept:'application/vnd.github+json'};
 say('Saving...');
 fetch(api+'?ref='+BRANCH,{headers:h}).then(function(r){if(!r.ok)throw new Error('Could not read the file ('+r.status+'). Check the token.');return r.json()})
 .then(function(f){return fetch(api,{method:'PUT',headers:h,body:JSON.stringify({message:'Update form recipients',branch:BRANCH,sha:f.sha,
   content:btoa(JSON.stringify({emails:emails},null,2)+'\n')})})})
 .then(function(r){if(!r.ok)throw new Error('Save failed ('+r.status+'). The token needs Contents: write access.');
   say('Saved. The live site updates in about a minute.')}).catch(function(e){say(e.message)})};
</script></body></html>
